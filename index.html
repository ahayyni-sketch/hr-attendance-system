<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATTENDIX — Smart Employee Attendance System</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <!-- Lucide Icons via CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/supabase-config.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            },
            slatex: {
              850: '#172033',
              900: '#0f172a',
            }
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: #F8FAFC;
      color: #0F172A;
      -webkit-tap-highlight-color: transparent;
    }
    .font-display {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    @keyframes scanline {
      0% { top: 8%; opacity: 0.2; }
      50% { top: 88%; opacity: 0.95; }
      100% { top: 8%; opacity: 0.2; }
    }
    .camera-scanline {
      animation: scanline 2.8s ease-in-out infinite;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.8); opacity: 0.75; }
      100% { transform: scale(2.1); opacity: 0; }
    }
    .gps-pulse {
      animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }
    @media print {
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      body * { visibility: hidden; }
      #printable-receipt, #printable-receipt * { visibility: visible; }
      #printable-receipt {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        box-shadow: none !important;
        border: 1px solid #cbd5e1 !important;
      }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="antialiased selection:bg-brand-600 selection:text-white">

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed top-4 right-4 z-[100] flex flex-col gap-2 max-w-sm w-full pointer-events-none px-4 sm:px-0"></div>

  <!-- Quick Page Switcher Floating Bar (Navigasi Cepat 15 Halaman) -->
  <div id="quick-switcher-bar" class="no-print fixed bottom-20 lg:bottom-5 right-4 z-50">
    <div class="relative">
      <button onclick="toggleQuickSwitcher()" class="flex items-center gap-2 bg-slate-900/95 hover:bg-slate-800 text-white text-xs font-medium px-3.5 py-2.5 rounded-full shadow-lg border border-slate-700 backdrop-blur transition">
        <i data-lucide="layers" class="w-4 h-4 text-brand-400"></i>
        <span>Navigasi 15 Fitur</span>
        <i data-lucide="chevron-up" class="w-3.5 h-3.5 text-slate-400"></i>
      </button>
      <div id="quick-switcher-menu" class="hidden absolute bottom-12 right-0 w-72 bg-white rounded-2xl shadow-2xl border border-slate-200 p-2 text-xs">
        <div class="px-3 py-2 border-b border-slate-100 flex items-center justify-between">
          <span class="font-bold text-slate-800">Semua Modul Aplikasi (15)</span>
          <span class="text-[10px] bg-brand-50 text-brand-700 font-semibold px-2 py-0.5 rounded-full">Enterprise</span>
        </div>
        <div class="max-h-80 overflow-y-auto divide-y divide-slate-50 mt-1" id="quick-switcher-list"></div>
      </div>
    </div>
  </div>

  <!-- Root App Container -->
  <div id="app" class="min-h-screen flex flex-col"></div>

  <!-- Modal Detail Riwayat Harian -->
  <div id="attendance-detail-modal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <h3 class="font-display font-bold text-lg text-slate-900">Detail Catatan Kehadiran</h3>
        <button onclick="closeAttendanceModal()" class="p-1.5 rounded-xl text-slate-400 hover:text-slate-700 hover:bg-slate-100">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div id="attendance-modal-body" class="py-4 space-y-3 text-sm"></div>
      <div class="pt-3 border-t border-slate-100 flex justify-end">
        <button onclick="closeAttendanceModal()" class="px-4 py-2 bg-slate-900 text-white rounded-xl text-sm font-medium hover:bg-slate-800 transition">Tutup</button>
      </div>
    </div>
  </div>

  <!-- Modal Tambah Agenda Kalender -->
  <div id="calendar-event-modal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-7 shadow-2xl border border-slate-100">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <div>
          <h3 class="font-display font-bold text-lg text-slate-900">Tambah Jadwal & Agenda</h3>
          <p class="text-xs text-slate-500">Jadwalkan rapat tim, review sprint, atau kegiatan perusahaan.</p>
        </div>
        <button onclick="closeCalendarModal()" class="p-1.5 rounded-xl text-slate-400 hover:text-slate-700 hover:bg-slate-100">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <form onsubmit="handleAddCalendarEvent(event)" class="pt-4 space-y-4 text-xs sm:text-sm">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Judul Agenda / Rapat *</label>
          <input id="cal-ev-title" type="text" required placeholder="Contoh: Rapat Koordinasi Q4 Product Roadmap"
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-brand-600" />
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Tanggal *</label>
            <input id="cal-ev-date" type="date" required value="2026-11-25"
              class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-brand-600" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Kategori *</label>
            <select id="cal-ev-type" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-white focus:outline-none focus:border-brand-600">
              <option value="Rapat">Jadwal Rapat</option>
              <option value="Deadline">Deadline Proyek</option>
              <option value="Training">Pelatihan / Workshop</option>
              <option value="Libur">Hari Libur / Cuti Bersama</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Waktu Mulai</label>
            <input id="cal-ev-start" type="time" value="10:00"
              class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-brand-600" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Waktu Selesai</label>
            <input id="cal-ev-end" type="time" value="11:30"
              class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-brand-600" />
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Lokasi / Tautan Meeting</label>
          <input id="cal-ev-location" type="text" placeholder="Ruang Meeting Garuda Lt. 18 atau Google Meet"
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-brand-600" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Peserta / Divisi Terkait</label>
          <input id="cal-ev-participants" type="text" placeholder="Tim Engineering, Product Manager, UI/UX"
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-brand-600" />
        </div>
        <div class="pt-3 border-t border-slate-100 flex justify-end gap-2.5">
          <button type="button" onclick="closeCalendarModal()" class="px-4 py-2.5 rounded-xl bg-slate-100 text-slate-700 font-semibold text-xs">Batal</button>
          <button type="submit" class="px-5 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-semibold text-xs">Simpan Agenda</button>
        </div>
      </form>
    </div>
  </div>

    /**
     * Base Class: Employee (Abstraksi Karyawan)
     * Menerapkan Polimorfisme untuk aturan jam kerja, toleransi keterlambatan,
     * pengali lembur, kuota cuti, serta evaluasi status presensi.
     */
    class Employee {
      constructor({ nip, nama, email, jabatan, departemen }) {
        if (new.target === Employee) {
          throw new Error('Class Employee bersifat abstrak dan harus diinstansiasi melalui subclass jenis karyawan.');
        }
        this.nip = nip;
        this.nama = nama;
        this.email = email;
        this.jabatan = jabatan;
        this.departemen = departemen;
      }

      getJenisKaryawan() {
        return 'Umum';
      }

      getShiftStartMinutes() {
        return 8 * 60 + 30; // Default 08:30 WIB
      }

      getLateToleranceMinutes() {
        return 0;
      }

      getOvertimeMultiplier() {
        return 1.0;
      }

      getAnnualLeaveQuota() {
        return 12;
      }

      getWorkModePolicy() {
        return 'WFO Standar (Radius Kantor Maks. 100m)';
      }

      // Metode Polimorfik: mengevaluasi ketepatan waktu check-in sesuai jenis karyawan
      evaluateCheckIn(timeHHMM, distanceMeters = 0) {
        const [hh, mm] = timeHHMM.split(':').map(Number);
        const actualMinutes = hh * 60 + mm;
        const limitMinutes = this.getShiftStartMinutes() + this.getLateToleranceMinutes();
        const diff = actualMinutes - this.getShiftStartMinutes();

        if (actualMinutes <= limitMinutes) {
          return {
            status: 'Hadir',
            ketepatan: 'Tepat Waktu',
            catatan: `Check-in valid (${this.getJenisKaryawan()} • toleransi ${this.getLateToleranceMinutes()} mnt)`
          };
        }
        return {
          status: 'Terlambat',
          ketepatan: `Terlambat ${diff} Menit`,
          catatan: `Melewati batas shift + toleransi ${this.getLateToleranceMinutes()} mnt (${this.getJenisKaryawan()})`
        };
      }

      calculateOvertimePay(hours, baseHourlyRate = 75000) {
        return Math.round(hours * baseHourlyRate * this.getOvertimeMultiplier());
      }
    }

    /** Subclass 1: Karyawan Tetap (PKWTT) */
    class PermanentEmployee extends Employee {
      getJenisKaryawan() { return 'Karyawan Tetap (PKWTT)'; }
      getLateToleranceMinutes() { return 15; }
      getOvertimeMultiplier() { return 1.5; }
      getAnnualLeaveQuota() { return 12; }
      getWorkModePolicy() { return 'Hybrid / WFO (Toleransi 15 mnt, Lembur 1.5x, Cuti 12 Hari)'; }
    }

    /** Subclass 2: Karyawan Kontrak (PKWT) */
    class ContractEmployee extends Employee {
      getJenisKaryawan() { return 'Karyawan Kontrak (PKWT)'; }
      getLateToleranceMinutes() { return 10; }
      getOvertimeMultiplier() { return 1.25; }
      getAnnualLeaveQuota() { return 6; }
      getWorkModePolicy() { return 'WFO Terjadwal (Toleransi 10 mnt, Lembur 1.25x, Cuti 6 Hari)'; }
    }

    /** Subclass 3: Karyawan Shift / Operasional */
    class ShiftEmployee extends Employee {
      getJenisKaryawan() { return 'Karyawan Shift Operasional'; }
      getShiftStartMinutes() { return 8 * 60 + 0; } // Shift pagi 08:00
      getLateToleranceMinutes() { return 5; }
      getOvertimeMultiplier() { return 2.0; }
      getAnnualLeaveQuota() { return 12; }
      getWorkModePolicy() { return 'Shift Ketat 08:00 (Toleransi 5 mnt, Lembur 2.0x)'; }
    }

    /** Subclass 4: Karyawan Remote / Field Engineer */
    class RemoteEmployee extends Employee {
      getJenisKaryawan() { return 'Karyawan Remote / Field'; }
      getLateToleranceMinutes() { return 30; }
      getOvertimeMultiplier() { return 1.5; }
      getAnnualLeaveQuota() { return 14; }
      getWorkModePolicy() { return 'Flexible Geofencing (Toleransi 30 mnt, GPS Bebas Radius)'; }

      // Override khusus: RemoteEmployee tetap tepat waktu meski di luar radius kantor
      evaluateCheckIn(timeHHMM, distanceMeters = 0) {
        const res = super.evaluateCheckIn(timeHHMM, distanceMeters);
        res.catatan += ` | Lokasi Remote/Field (${distanceMeters}m dari pusat)`;
        return res;
      }
    }

    /** Factory Helper untuk membuat instance Polimorfik Karyawan */
    function createEmployeeInstance(typeKey, userData) {
      switch (typeKey) {
        case 'PKWT': return new ContractEmployee(userData);
        case 'SHIFT': return new ShiftEmployee(userData);
        case 'REMOTE': return new RemoteEmployee(userData);
        case 'PKWTT':
        default: return new PermanentEmployee(userData);
      }
    }

    /**
     * Class Encapsulation: PresenceRecord
     * Membungkus data presensi harian dengan private fields (#) agar tidak dapat
     * dimodifikasi sembarangan dari luar class tanpa validasi.
     */
    class PresenceRecord {
      #id;
      #tanggal;
      #hari;
      #checkInTime;
      #checkOutTime;
      #status;
      #lokasi;
      #catatan;
      #koordinat;
      #employeeType;
      #photoDataUrl;

      constructor({ id, tanggal, hari, masuk = '-', pulang = '-', status = 'Hadir', lokasi = '-', catatan = '', koordinat = '-', employeeType = 'Karyawan Tetap (PKWTT)', photoDataUrl = null }) {
        this.#id = id;
        this.#tanggal = tanggal;
        this.#hari = hari;
        this.#checkInTime = masuk;
        this.#checkOutTime = pulang;
        this.#status = status;
        this.#lokasi = lokasi;
        this.#catatan = catatan;
        this.#koordinat = koordinat;
        this.#employeeType = employeeType;
        this.#photoDataUrl = photoDataUrl;
      }

      // Getter terkontrol (Read-only exposure)
      get id() { return this.#id; }
      get tanggal() { return this.#tanggal; }
      get hari() { return this.#hari; }
      get masuk() { return this.#checkInTime; }
      get pulang() { return this.#checkOutTime; }
      get status() { return this.#status; }
      get lokasi() { return this.#lokasi; }
      get catatan() { return this.#catatan; }
      get koordinat() { return this.#koordinat; }
      get employeeType() { return this.#employeeType; }

      // Setter terkontrol dengan enkapsulasi & validasi bisnis
      recordCheckOut(timeHHMM, extraNote = '') {
        if (this.#checkInTime === '-' || !this.#checkInTime) {
          throw new Error('Tidak dapat melakukan Absen Pulang sebelum Absen Masuk tercatat.');
        }
        this.#checkOutTime = timeHHMM;
        if (extraNote) {
          this.#catatan = `${this.#catatan} | Pulang: ${extraNote}`;
        }
      }

      get durasi() {
        if (!this.#checkInTime || this.#checkInTime === '-') return '0j 00m';
        if (!this.#checkOutTime || this.#checkOutTime === '-') return 'Sedang Berjalan';
        const [inH, inM] = this.#checkInTime.split(':').map(Number);
        const [outH, outM] = this.#checkOutTime.split(':').map(Number);
        let diffMins = (outH * 60 + outM) - (inH * 60 + inM);
        if (diffMins < 0) diffMins += 24 * 60;
        const hrs = Math.floor(diffMins / 60);
        const mins = diffMins % 60;
        return `${hrs}j ${String(mins).padStart(2, '0')}m`;
      }

      toJSON() {
        return {
          id: this.#id,
          tanggal: this.#tanggal,
          hari: this.#hari,
          masuk: this.#checkInTime,
          pulang: this.#checkOutTime,
          durasi: this.durasi,
          status: this.#status,
          lokasi: this.#lokasi,
          catatan: this.#catatan,
          koordinat: this.#koordinat,
          employeeType: this.#employeeType,
          photoDataUrl: this.#photoDataUrl
        };
      }
    }

    /**
     * Class Encapsulation: AttendanceRepository
     * Mengelola koleksi PresenceRecord secara privat (#records) & sinkronisasi dengan UI.
     */
    class AttendanceRepository {
      #records = [];
      #todayRecord = null;

      constructor(initialRawRecords = []) {
        this.#records = initialRawRecords.map(item => new PresenceRecord(item));
      }

      getAll() {
        return this.#records.map(r => r.toJSON());
      }

      findById(id) {
        const rec = this.#records.find(r => r.id === id);
        return rec ? rec.toJSON() : null;
      }

      getTodayStatus() {
        if (!this.#todayRecord) {
          return { status: 'BELUM_ABSEN', checkInTime: null, checkOutTime: null };
        }
        if (this.#todayRecord.pulang === '-') {
          return { status: 'SUDAH_CHECKIN', checkInTime: this.#todayRecord.masuk, checkOutTime: null };
        }
        return {
          status: 'SUDAH_CHECKOUT',
          checkInTime: this.#todayRecord.masuk,
          checkOutTime: this.#todayRecord.pulang
        };
      }

      processCheckIn(employeeInstance, { timeHHMM, lokasi, koordinat, distanceMeters, userNote, photoDataUrl = null }) {
        if (this.#todayRecord && this.#todayRecord.masuk !== '-') {
          throw new Error(`Anda sudah melakukan Absen Masuk hari ini pada pukul ${this.#todayRecord.masuk}.`);
        }
        const evalResult = employeeInstance.evaluateCheckIn(timeHHMM, distanceMeters);
        const finalNote = userNote ? `${userNote} — ${evalResult.catatan}` : evalResult.catatan;

        const record = new PresenceRecord({
          id: 'ATT-' + Date.now(),
          tanggal: '2026-11-24',
          hari: 'Selasa, 24 Nov 2026 (Hari Ini)',
          masuk: timeHHMM,
          pulang: '-',
          status: evalResult.status,

    function showToast(title, message, type = 'success') {
      const container = document.getElementById('toast-container');
      const colors = {
        success: 'bg-emerald-600 text-white border-emerald-500',
        info: 'bg-brand-600 text-white border-brand-500',
        warning: 'bg-amber-500 text-white border-amber-400',
        error: 'bg-rose-600 text-white border-rose-500'
      };
      const icons = {
        success: 'check-circle',
        info: 'info',
        warning: 'alert-triangle',
        error: 'x-circle'
      };
      const toast = document.createElement('div');
      toast.className = `pointer-events-auto flex items-start gap-3 p-3.5 rounded-2xl shadow-xl border ${colors[type] || colors.info} transition-all duration-300`;
      toast.innerHTML = `
        <i data-lucide="${icons[type] || 'info'}" class="w-5 h-5 shrink-0 mt-0.5"></i>
        <div class="flex-1 text-xs">
          <p class="font-bold text-sm leading-tight">${title}</p>
          <p class="opacity-90 mt-0.5">${message}</p>
        </div>
      `;
      container.appendChild(toast);
      lucide.createIcons();
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-10px)';
        setTimeout(() => toast.remove(), 300);
      }, 3600);
    }

    function formatIndonesianDate(isoStr) {
      if (!isoStr) return '-';
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
      const parts = isoStr.split('-');
      if (parts.length !== 3) return isoStr;
      return `${parseInt(parts[2], 10)} ${months[parseInt(parts[1], 10) - 1]} ${parts[0]}`;
    }

    // 6. HALAMAN BARU 1: KALENDER KERJA & JADWAL RAPAT LENGKAP (kalender_kerja)
    // =========================================================================
    function renderCalendarPage() {
      const cs = state.calendarState;
      const monthNames = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
      const dayNames = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];

      const firstDayOfMonth = new Date(cs.year, cs.month, 1).getDay();
      const daysInMonth = new Date(cs.year, cs.month + 1, 0).getDate();

      const getTypeBadgeStyle = (type) => {
        switch (type) {
          case 'Rapat': return 'bg-brand-100 text-brand-700 border-brand-200';
          case 'Deadline': return 'bg-rose-100 text-rose-700 border-rose-200';
          case 'Training': return 'bg-purple-100 text-purple-700 border-purple-200';
          case 'Libur': return 'bg-emerald-100 text-emerald-700 border-emerald-200';
          default: return 'bg-slate-100 text-slate-700 border-slate-200';
        }
      };

      const getDotColor = (type) => {
        switch (type) {
          case 'Rapat': return 'bg-brand-600';
          case 'Deadline': return 'bg-rose-500';
          case 'Training': return 'bg-purple-600';
          case 'Libur': return 'bg-emerald-500';
          default: return 'bg-slate-500';
        }
      };

      // Build grid cells
      let calendarCells = '';
      for (let i = 0; i < firstDayOfMonth; i++) {
        calendarCells += `<div class="h-20 sm:h-24 bg-slate-50/50 border-b border-r border-slate-100 p-1.5"></div>`;
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${cs.year}-${String(cs.month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayEvents = state.calendarEvents.filter(e => e.date === dateStr && (cs.filterCategory === 'Semua' || e.type === cs.filterCategory));
        const isSelected = cs.selectedDate === dateStr;
        const isToday = dateStr === '2026-11-24';

        calendarCells += `
          <div onclick="state.calendarState.selectedDate='${dateStr}'; renderApp();"
            class="h-20 sm:h-24 border-b border-r border-slate-100 p-1.5 sm:p-2 cursor-pointer transition flex flex-col justify-between ${
              isSelected ? 'bg-brand-50/80 ring-2 ring-inset ring-brand-600' : 'bg-white hover:bg-slate-50'
            }">
            <div class="flex items-center justify-between">
              <span class="w-6 h-6 rounded-full text-xs font-bold flex items-center justify-center ${
                isToday ? 'bg-brand-600 text-white' : isSelected ? 'text-brand-700' : 'text-slate-700'
              }">${day}</span>
              ${dayEvents.length > 0 ? `<span class="text-[10px] font-bold text-slate-400">${dayEvents.length}</span>` : ''}
            </div>
            <div class="space-y-1 overflow-hidden">
              ${dayEvents.slice(0, 2).map(ev => `
                <div class="flex items-center gap-1 px-1.5 py-0.5 rounded text-[10px] font-semibold truncate border ${getTypeBadgeStyle(ev.type)}">
                  <span class="w-1.5 h-1.5 rounded-full shrink-0 ${getDotColor(ev.type)}"></span>
                  <span class="truncate">${ev.title}</span>
                </div>
              `).join('')}
              ${dayEvents.length > 2 ? `<p class="text-[9px] font-bold text-brand-600 pl-1">+${dayEvents.length - 2} lainnya</p>` : ''}
            </div>
          </div>
        `;
      }

      const selectedEvents = state.calendarEvents.filter(e => e.date === cs.selectedDate);

      const content = `
        <div class="space-y-6">
          <!-- Top Control Bar -->
          <div class="bg-white rounded-2xl border border-slate-200/80 p-4 sm:p-5 shadow-xs flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div class="flex items-center gap-3">
              <div class="flex items-center bg-slate-100 rounded-xl p-1">
                <button onclick="changeCalendarMonth(-1)" class="p-2 rounded-lg hover:bg-white text-slate-700 transition">
                  <i data-lucide="chevron-left" class="w-4 h-4"></i>
                </button>
                <span class="px-4 font-display font-bold text-sm sm:text-base text-slate-900 min-w-[155px] text-center">
                  ${monthNames[cs.month]} ${cs.year}
                </span>
                <button onclick="changeCalendarMonth(1)" class="p-2 rounded-lg hover:bg-white text-slate-700 transition">
                  <i data-lucide="chevron-right" class="w-4 h-4"></i>
                </button>
              </div>
              <button onclick="state.calendarState.year=2026; state.calendarState.month=10; state.calendarState.selectedDate='2026-11-24'; renderApp();"
                class="px-3.5 py-2 rounded-xl border border-slate-200 hover:bg-slate-50 text-xs font-semibold text-slate-700">
                Hari Ini
              </button>
            </div>

            <div class="flex flex-wrap items-center gap-2.5">
              <select onchange="state.calendarState.filterCategory=this.value; renderApp();" class="px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs font-semibold bg-white">
                <option value="Semua" ${cs.filterCategory === 'Semua' ? 'selected' : ''}>Semua Kategori Agenda</option>
                <option value="Rapat" ${cs.filterCategory === 'Rapat' ? 'selected' : ''}>Jadwal Rapat</option>
                <option value="Deadline" ${cs.filterCategory === 'Deadline' ? 'selected' : ''}>Deadline Proyek</option>
                <option value="Training" ${cs.filterCategory === 'Training' ? 'selected' : ''}>Training / Workshop</option>
                <option value="Libur" ${cs.filterCategory === 'Libur' ? 'selected' : ''}>Hari Libur & Cuti</option>
              </select>

              <button onclick="openCalendarModal('${cs.selectedDate}')" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold shadow-sm transition">
                <i data-lucide="calendar-plus" class="w-4 h-4"></i>
                <span>Tambah Jadwal Rapat</span>
              </button>
            </div>
          </div>

          <!-- Main Calendar Grid + Selected Day Agenda Panel -->
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <!-- Calendar Grid (8 Cols) -->
            <div class="lg:col-span-8 bg-white rounded-3xl border border-slate-200/80 shadow-xs overflow-hidden">
              <div class="grid grid-cols-7 bg-slate-900 text-white text-center py-2.5 text-xs font-bold">
                ${dayNames.map(d => `<div>${d}</div>`).join('')}
              </div>
              <div class="grid grid-cols-7 border-l border-t border-slate-100">
                ${calendarCells}
              </div>
              <div class="px-5 py-3 bg-slate-50 border-t border-slate-100 flex flex-wrap items-center gap-4 text-[11px] text-slate-600">
                <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-brand-600"></span>Jadwal Rapat</span>
                <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span>Deadline Proyek</span>
                <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-purple-600"></span>Training</span>
                <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>Hari Libur / Cuti</span>
              </div>
            </div>

            <!-- Selected Date Details (4 Cols) -->
            <div class="lg:col-span-4 space-y-5">
              <div class="bg-white rounded-3xl border border-slate-200/80 shadow-xs p-6">
                <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                  <div>
                    <span class="text-[11px] font-bold uppercase tracking-wider text-brand-600">Detail Agenda Tanggal</span>
                    <h3 class="font-display font-extrabold text-lg text-slate-900 mt-0.5">${formatIndonesianDate(cs.selectedDate)}</h3>
                  </div>
                  <button onclick="openCalendarModal('${cs.selectedDate}')" class="p-2 rounded-xl bg-brand-50 text-brand-700 hover:bg-brand-100" title="Tambah Agenda">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                  </button>
                </div>

                <div class="mt-4 space-y-3.5">
                  ${selectedEvents.length === 0 ? `
                    <div class="py-8 text-center space-y-2">
                      <div class="w-12 h-12 rounded-2xl bg-slate-100 text-slate-400 flex items-center justify-center mx-auto">
                        <i data-lucide="calendar-off" class="w-6 h-6"></i>
                      </div>
                      <p class="text-xs font-semibold text-slate-700">Tidak ada agenda rapat pada tanggal ini</p>
                      <p class="text-[11px] text-slate-400">Klik tombol + untuk menambahkan rapat atau pengingat baru.</p>
                    </div>
                  ` : selectedEvents.map(ev => `
                    <div class="p-4 rounded-2xl border border-slate-200/80 bg-slate-50/70 space-y-2">
                      <div class="flex items-center justify-between gap-2">
                        <span class="text-[10px] font-bold px-2.5 py-0.5 rounded-full border ${getTypeBadgeStyle(ev.type)}">${ev.type}</span>
                        <span class="text-xs font-mono font-bold text-slate-700">${ev.start} - ${ev.end}</span>
                      </div>
                      <h4 class="font-display font-bold text-sm text-slate-900">${ev.title}</h4>
                      <p class="text-xs text-slate-600 leading-relaxed">${ev.desc}</p>
                      <div class="pt-2 border-t border-slate-200/60 space-y-1 text-[11px] text-slate-500">
                        <p class="flex items-center gap-1.5"><i data-lucide="map-pin" class="w-3.5 h-3.5 text-brand-600"></i> ${ev.location}</p>
                        <p class="flex items-center gap-1.5"><i data-lucide="users" class="w-3.5 h-3.5 text-slate-400"></i> ${ev.participants}</p>
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>

              <!-- Upcoming Highlights -->
              <div class="bg-slate-900 text-white rounded-3xl p-5 space-y-3">
                <h4 class="font-display font-bold text-sm flex items-center gap-2">
                  <i data-lucide="sparkles" class="w-4 h-4 text-amber-400"></i>
                  <span>Agenda Penting Mendatang</span>
                </h4>
                <div class="space-y-2.5 text-xs">
                  ${state.calendarEvents.slice(2, 5).map(ev => `
                    <div onclick="state.calendarState.selectedDate='${ev.date}'; renderApp();" class="p-2.5 rounded-xl bg-white/10 hover:bg-white/15 cursor-pointer transition flex items-center justify-between gap-2">
                      <div class="min-w-0">
                        <p class="font-semibold truncate">${ev.title}</p>
                        <p class="text-[11px] text-slate-300">${formatIndonesianDate(ev.date)} • ${ev.start}</p>
                      </div>
                      <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400 shrink-0"></i>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>
          </div>
        </div>
      `;

      return renderEnterpriseShell('Kalender Kerja & Jadwal Rapat', 'Kelola agenda rapat tim, deadline proyek, pelatihan, dan jadwal libur.', content);
    }

    async function initCameraAndGps() {
      const videoEl = document.getElementById('webrtc-video');
      const fallbackEl = document.getElementById('camera-fallback-sim');
      const badgeEl = document.getElementById('camera-mode-badge');

      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        try {
          stopCameraStream();
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
          activeMediaStream = stream;
          if (videoEl) { videoEl.srcObject = stream; videoEl.classList.remove('hidden'); }
          if (fallbackEl) fallbackEl.classList.add('hidden');
          if (badgeEl) badgeEl.textContent = 'Kamera Live Aktif';
        } catch (err) {
          if (videoEl) videoEl.classList.add('hidden');
          if (fallbackEl) fallbackEl.classList.remove('hidden');
          if (badgeEl) badgeEl.textContent = 'Simulasi Kamera Aktif';
        }
      }
    }

    function captureAttendanceSnapshot() {
      const videoEl = document.getElementById('webrtc-video');
      const canvasEl = document.getElementById('capture-canvas');
      if (videoEl && canvasEl && !videoEl.classList.contains('hidden') && videoEl.videoWidth > 0) {
        canvasEl.width = videoEl.videoWidth;
        canvasEl.height = videoEl.videoHeight;
        const ctx = canvasEl.getContext('2d');
        // Mirror horizontally to match preview
        ctx.translate(canvasEl.width, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(videoEl, 0, 0, canvasEl.width, canvasEl.height);
        return canvasEl.toDataURL('image/jpeg', 0.88);
      }
      return null;
    }

    function submitPresenceVerification() {
      const now = new Date();
      const shortTime = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      const isMasuk = state.verification.tipeAbsen === 'MASUK';
      const userNote = document.getElementById('absen-notes-input')?.value.trim() || '';
      const koordinatStr = `${state.verification.lat.toFixed(6)}, ${state.verification.lng.toFixed(6)}`;
      const capturedSnapshot = captureAttendanceSnapshot();

      try {
        let statusKetepatan = 'Tepat Waktu';

        if (isMasuk) {
          const { record, evalResult } = attendanceRepo.processCheckIn(activeEmployee, {
            timeHHMM: shortTime,
            lokasi: 'Kantor Pusat Sudirman (GPS)',
            koordinat: koordinatStr,
            distanceMeters: state.verification.distanceMeters,
            userNote,
            photoDataUrl: capturedSnapshot
          });
          statusKetepatan = evalResult.ketepatan;
          if (record.status === 'Hadir') {
            state.monthlyAnalytics.months[5].hadir += 1;
          } else {
            state.monthlyAnalytics.months[5].terlambat += 1;
          }
        } else {
          const updatedRecord = attendanceRepo.processCheckOut({
            timeHHMM: shortTime,
            userNote
          });
          statusKetepatan = `Selesai Kerja (${updatedRecord.durasi})`;
        }

        syncOopStateToUi();

        state.lastReceipt = {
          trxId: `ABS-20261124-${Math.floor(100000 + Math.random() * 900000)}`,
          tipe: isMasuk ? 'Absen Masuk (Check-In)' : 'Absen Pulang (Check-Out)',
          tanggal: 'Selasa, 24 November 2026',
          waktu: `${shortTime}:15 WIB`,
          koordinat: koordinatStr,
          alamatGps: state.verification.address,
          statusKetepatan: `${statusKetepatan} • ${activeEmployee.getJenisKaryawan()}`,
          akurasiGps: '± 6 meter',
          fotoDataUrl: capturedSnapshot
        };

        showToast('Absensi Terverifikasi (OOP)', `${state.lastReceipt.tipe} berhasil dienkapsulasi ke riwayat.`, 'success');
        navigateTo('bukti_absensi_berhasil');
      } catch (err) {
        showToast('Validasi Encapsulation Presensi', err.message, 'error');
      }
    }

    function openAttendanceModal(id) {
      const item = state.attendanceHistory.find(a => a.id === id);
      if (!item) return;
      const photoHtml = item.photoDataUrl ? `
        <div class="rounded-xl overflow-hidden border border-slate-200 bg-slate-950 aspect-video relative">
          <img src="${item.photoDataUrl}" alt="Foto Absensi" class="w-full h-full object-cover" />
          <span class="absolute bottom-2 right-2 px-2 py-0.5 rounded bg-emerald-500 text-slate-950 text-[10px] font-extrabold">BUKTI FOTO KAMERA</span>
        </div>
      ` : '';
      document.getElementById('attendance-modal-body').innerHTML = `
        ${photoHtml}
        <div class="flex justify-between"><span class="text-slate-500">Tanggal</span><strong>${item.hari}</strong></div>
        <div class="flex justify-between"><span class="text-slate-500">Status</span>${getStatusBadge(item.status)}</div>
        <div class="flex justify-between"><span class="text-slate-500">Masuk / Pulang</span><span class="font-mono font-bold">${item.masuk} — ${item.pulang}</span></div>
        <div class="p-3 rounded-xl bg-slate-50 text-xs text-slate-600">${item.catatan}</div>
      `;
      document.getElementById('attendance-detail-modal').classList.remove('hidden');
    }

    function closeAttendanceModal() {
      document.getElementById('attendance-detail-modal').classList.add('hidden');
    }

    function handleCreateLeaveSubmit(e) {
      e.preventDefault();
      const jenis = document.getElementById('leave-jenis').value;
      const start = document.getElementById('leave-start').value;
      const end = document.getElementById('leave-end').value;
      const reason = document.getElementById('leave-reason').value.trim();

      const newReq = {
        id: `REQ-2026-0${Math.floor(200 + Math.random() * 799)}`,
        jenis,
        tanggalMulai: start,
        tanggalSelesai: end,
        durasi: 1,
        alasan: reason,
        tanggalPengajuan: '24 Nov 2026',
        status: 'Menunggu',
        timeline: [{ step: 'Pengajuan Dikirim', actor: state.user.nama, time: 'Baru saja', done: true }]
      };
      state.leaveRequests.unshift(newReq);
      showToast('Pengajuan Terkirim', `Tiket ${newReq.id} berhasil dibuat.`, 'success');
      navigateTo('izin_cuti');
    }

    function startLiveClock() {
      if (clockInterval) clearInterval(clockInterval);
      const update = () => {
        const timeStr = new Date().toLocaleTimeString('id-ID', { hour12: false });
        const clockEl = document.getElementById('live-digital-clock');
        const camOverlayEl = document.getElementById('camera-overlay-time');
        if (clockEl) clockEl.textContent = timeStr;
        if (camOverlayEl) camOverlayEl.textContent = `24/11/2026 ${timeStr} WIB`;
      };
      update();
      clockInterval = setInterval(update, 1000);
    }

    function renderApp() {
      const appEl = document.getElementById('app');
      let html = '';

      switch (state.currentPage) {
        case 'login_karyawan': html = renderLoginPage(); break;
        case 'register_karyawan': html = renderRegisterPage(); break;
        case 'dashboard_karyawan': html = renderDashboardPage(); break;
        case 'verifikasi_kamera_gps': html = renderVerificationPage(); break;
        case 'bukti_absensi_berhasil': html = renderReceiptPage(); break;
        case 'riwayat_kehadiran': html = renderAttendanceHistoryPage(); break;
        case 'kalender_kerja': html = renderCalendarPage(); break;
        case 'laporan_bulanan': html = renderMonthlyReportPage(); break;
        case 'lembur_reimburse': html = renderOvertimeReimbursePage(); break;
        case 'direktori_tim': html = renderTeamDirectoryPage(); break;
        case 'izin_cuti': html = renderLeaveListPage(); break;
        case 'ajukan_izin_cuti': html = renderCreateLeavePage(); break;
        case 'detail_pengajuan': html = renderLeaveDetailPage(); break;
        case 'profil_karyawan': html = renderProfilePage(); break;
        case 'pengaturan_keamanan_akun': html = renderSecuritySettingsPage(); break;
        default: html = renderDashboardPage();
      }

      appEl.innerHTML = html;
      const quickBar = document.getElementById('quick-switcher-bar');
      if (quickBar) quickBar.classList.toggle('hidden', !state.isAuthenticated);
      renderQuickSwitcherList();
      lucide.createIcons();

      if (state.currentPage === 'verifikasi_kamera_gps') {
        initCameraAndGps();
      }
    }


    // =====================================================================
    // ATTENDIX PRODUCTION AUTH + SUPABASE DATA LAYER
    // =====================================================================
    const supabaseClient = window.supabase.createClient(
      window.ATTENDIX_SUPABASE_URL,
      window.ATTENDIX_SUPABASE_ANON_KEY,
      { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }
    );
    let currentProfile = null;
    let currentCompany = null;

    function setProfileToState(profile) {
      currentProfile = profile;
      state.user = {
        id: profile.id, nip: profile.nip || '-', nama: profile.full_name || 'Karyawan',
        email: profile.email || '', jabatan: profile.position || '-',
        departemen: profile.department || '-', employeeTypeKey: profile.employee_type || 'PKWTT',
        statusKepegawaian: profile.employee_type || 'Karyawan Tetap (PKWTT)',
        tanggalBergabung: profile.joined_at || new Date().toISOString().slice(0,10),
        telepon: profile.phone || '', alamat: profile.address || '',
        kontakDaruratNama: profile.emergency_contact_name || '',
        kontakDaruratTelp: profile.emergency_contact_phone || '',
        lokasiKantor: currentCompany?.name || 'Perusahaan',
        shift: profile.work_schedule || '08:00 - 17:00',
        sisaCutiTahunan: profile.leave_balance ?? 12, totalKuotaCuti: profile.leave_quota ?? 12,
        avatarUrl: profile.avatar_url || ''
      };
      activeEmployee = createEmployeeInstance(state.user.employeeTypeKey, state.user);
    }

    async function loadProfileAndCompany(user) {
      const { data: profile, error } = await supabaseClient
        .from('employee_profiles').select('*').eq('id', user.id).single();
      if (error) throw new Error('Profil karyawan belum tersedia. Pastikan kode perusahaan valid dan jalankan SQL setup.');
      currentProfile = profile;
      const { data: company, error: companyError } = await supabaseClient
        .from('companies').select('*').eq('id', profile.company_id).single();
      if (companyError) throw companyError;
      currentCompany = company;
      setProfileToState(profile);
      const { data: rows, error: attendanceError } = await supabaseClient
        .from('attendance_records').select('*').eq('employee_id', user.id)
        .order('attendance_date', { ascending: false }).limit(100);
      if (attendanceError) throw attendanceError;
      state.attendanceHistory = (rows || []).map(r => ({
        id: r.id, tanggal: r.attendance_date, hari: new Date(r.attendance_date+'T00:00:00').toLocaleDateString('id-ID',{weekday:'long',day:'2-digit',month:'short',year:'numeric'}),
        masuk: r.check_in_at ? new Date(r.check_in_at).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',hour12:false}) : '-',
        pulang: r.check_out_at ? new Date(r.check_out_at).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',hour12:false}) : '-',
        durasi: '-', status: r.status || 'Hadir', lokasi: r.address || '-', catatan: r.notes || '',
        koordinat: r.latitude && r.longitude ? `${r.latitude}, ${r.longitude}` : '-', photoUrl: r.photo_url || ''
      }));
      const today = new Date().toISOString().slice(0,10);
      const todayRow = state.attendanceHistory.find(x => x.tanggal === today);
      state.todayPresence = todayRow ? {
        status: todayRow.pulang !== '-' ? 'SUDAH_PULANG' : 'SUDAH_MASUK',
        checkInTime: todayRow.masuk, checkOutTime: todayRow.pulang
      } : { status:'BELUM_ABSEN', checkInTime:null, checkOutTime:null };
      state.teamDirectory = [];
      state.leaveRequests = [];
    }

    async function refreshAuthenticatedApp() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        state.isAuthenticated = false;
        state.currentPage = 'login_karyawan';
        renderApp();
        return;
      }
      try {
        await loadProfileAndCompany(session.user);
        state.isAuthenticated = true;
        state.currentPage = 'dashboard_karyawan';
      } catch (err) {
        console.error(err);
        await supabaseClient.auth.signOut();
        state.isAuthenticated = false;
        state.currentPage = 'login_karyawan';
        showToast('Gagal memuat akun', err.message, 'error');
      }
      renderApp();
    }

    handleLoginSubmit = async function(e) {
      e.preventDefault();
      const email = document.getElementById('login-identifier').value.trim();
      const password = document.getElementById('login-password').value;
      const button = e.submitter;
      if (button) { button.disabled = true; button.textContent = 'Memverifikasi...'; }
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        showToast('Login gagal', error.message, 'error');
        if (button) { button.disabled = false; button.textContent = 'Masuk ke Dashboard'; }
        return;
      }
      try {
        await loadProfileAndCompany(data.user);
        state.isAuthenticated = true;
        state.currentPage = 'dashboard_karyawan';
        showToast('Login berhasil', `Selamat datang, ${state.user.nama}.`, 'success');
        renderApp();
      } catch (err) {
        showToast('Data akun belum siap', err.message, 'error');
      } finally {
        if (button) { button.disabled = false; button.textContent = 'Masuk ke Dashboard'; }
      }
    };

    handleRegisterSubmit = async function(e) {
      e.preventDefault();
      const pass = document.getElementById('reg-pass').value;
      const confirm = document.getElementById('reg-pass-confirm').value;
      if (pass !== confirm) return showToast('Validasi gagal', 'Konfirmasi password tidak cocok.', 'error');
      const button = e.submitter;
      if (button) { button.disabled = true; button.textContent = 'Mendaftarkan...'; }
      const metadata = {
        full_name: document.getElementById('reg-nama').value.trim(),
        nip: document.getElementById('reg-nip').value.trim(),
        department: document.getElementById('reg-divisi').value,
        position: document.getElementById('reg-jabatan').value.trim(),
        company_code: document.getElementById('reg-company-code').value.trim().toUpperCase()
      };
      const email = document.getElementById('reg-email').value.trim().toLowerCase();
      const { data, error } = await supabaseClient.auth.signUp({
        email, password: pass, options: { data: metadata }
      });
      if (error) {
        showToast('Pendaftaran gagal', error.message, 'error');
      } else if (data.session) {
        try {
          await loadProfileAndCompany(data.user);
          state.isAuthenticated = true; state.currentPage = 'dashboard_karyawan';
          showToast('Pendaftaran berhasil', 'Akun dan profil tersimpan di Supabase.', 'success');
          renderApp();
        } catch (err) {
          showToast('Akun dibuat, profil belum siap', err.message, 'error');
        }
      } else {
        showToast('Periksa email Anda', 'Konfirmasi email terlebih dahulu, lalu masuk menggunakan akun yang didaftarkan.', 'success');
        navigateTo('login_karyawan');
      }
      if (button) { button.disabled = false; button.textContent = 'Daftarkan Akun'; }
    };

    handleLogout = async function() {
      stopCameraStream();
      await supabaseClient.auth.signOut();
      currentProfile = null; currentCompany = null;
      state.isAuthenticated = false; state.currentPage = 'login_karyawan';
      renderApp();
      showToast('Berhasil keluar', 'Sesi akun telah diakhiri.', 'info');
    };

    const originalNavigateTo = navigateTo;
    navigateTo = function(pageId, params = {}) {
      if (!state.isAuthenticated && !['login_karyawan','register_karyawan'].includes(pageId)) {
        pageId = 'login_karyawan';
      }
      return originalNavigateTo(pageId, params);
    };

    initCameraAndGps = async function() {
      const videoEl = document.getElementById('webrtc-video');
      const fallbackEl = document.getElementById('camera-fallback-sim');
      const badgeEl = document.getElementById('camera-mode-badge');
      try {
        if (!navigator.mediaDevices?.getUserMedia) throw new Error('Kamera tidak tersedia');
        stopCameraStream();
        activeMediaStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});
        if (videoEl) { videoEl.srcObject = activeMediaStream; videoEl.classList.remove('hidden'); }
        if (fallbackEl) fallbackEl.classList.add('hidden');
        if (badgeEl) badgeEl.textContent = 'Kamera Live Aktif';
      } catch (err) {
        if (videoEl) videoEl.classList.add('hidden');
        if (fallbackEl) fallbackEl.classList.remove('hidden');
        if (badgeEl) badgeEl.textContent = 'Kamera tidak tersedia';
      }
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          state.verification.lat = pos.coords.latitude;
          state.verification.lng = pos.coords.longitude;
          state.verification.gpsReady = true;
          state.verification.distanceMeters = null;
          state.verification.address = 'Lokasi GPS perangkat';
          const gpsEl = document.getElementById('gps-status-label');
          if (gpsEl) gpsEl.textContent = `GPS aktif • akurasi ±${Math.round(pos.coords.accuracy)} meter`;
        }, err => showToast('GPS diperlukan', 'Izinkan akses lokasi untuk melakukan presensi.', 'warning'),
        {enableHighAccuracy:true, timeout:15000, maximumAge:0});
      }
    };

    submitPresenceVerification = async function() {
      if (!currentProfile || !currentCompany) return showToast('Sesi tidak valid','Silakan login ulang.','error');
      const isMasuk = state.verification.tipeAbsen === 'MASUK';
      const photo = captureAttendanceSnapshot();
      if (!photo) return showToast('Foto diperlukan','Aktifkan kamera dan ambil foto selfie terlebih dahulu.','error');
      if (!navigator.geolocation) return showToast('GPS tidak tersedia','Perangkat harus mendukung GPS.','error');
      if (!Number.isFinite(state.verification.lat) || !Number.isFinite(state.verification.lng)) {
        return showToast('Lokasi belum tersedia','Izinkan akses lokasi lalu coba kembali.','error');
      }
      try {
        const blob = await (await fetch(photo)).blob();
        const filePath = `${currentProfile.company_id}/${currentProfile.id}/${Date.now()}.jpg`;
        const { error: uploadError } = await supabaseClient.storage.from('attendance-photos')
          .upload(filePath, blob, {contentType:'image/jpeg', upsert:false});
        if (uploadError) throw uploadError;
        const { data: signed } = await supabaseClient.storage.from('attendance-photos').createSignedUrl(filePath, 60*60*24*365);
        const photoUrl = signed?.signedUrl || null;
        const now = new Date();
        const date = now.toISOString().slice(0,10);
        const coords = { latitude: state.verification.lat, longitude: state.verification.lng };
        if (isMasuk) {
          const { data, error } = await supabaseClient.from('attendance_records').insert({
            company_id: currentProfile.company_id, employee_id: currentProfile.id,
            attendance_date: date, check_in_at: now.toISOString(),
            latitude: coords.latitude, longitude: coords.longitude,
            address: state.verification.address, photo_path: filePath, photo_url: photoUrl,
            notes: document.getElementById('absen-notes-input')?.value.trim() || '',
            status: 'Hadir'
          }).select().single();
          if (error) throw error;
          state.lastReceipt = {trxId:data.id, tipe:'Absen Masuk', tanggal:date, waktu:now.toLocaleTimeString('id-ID'), koordinat:`${coords.latitude}, ${coords.longitude}`, alamatGps:state.verification.address, statusKetepatan:'Tercatat', akurasiGps:'GPS perangkat', fotoDataUrl:photo};
        } else {
          const { data: existing, error: findError } = await supabaseClient.from('attendance_records')
            .select('id').eq('employee_id',currentProfile.id).eq('attendance_date',date).single();
          if (findError) throw new Error('Belum ada catatan check-in hari ini.');
          const { data, error } = await supabaseClient.from('attendance_records').update({
            check_out_at:now.toISOString(), checkout_photo_path:filePath, checkout_photo_url:photoUrl
          }).eq('id',existing.id).select().single();
          if (error) throw error;
          state.lastReceipt = {trxId:data.id, tipe:'Absen Pulang', tanggal:date, waktu:now.toLocaleTimeString('id-ID'), koordinat:`${coords.latitude}, ${coords.longitude}`, alamatGps:state.verification.address, statusKetepatan:'Pulang tercatat', akurasiGps:'GPS perangkat', fotoDataUrl:photo};
        }
        await loadProfileAndCompany((await supabaseClient.auth.getUser()).data.user);
        showToast('Presensi tersimpan','Data presensi dan foto berhasil disimpan ke Supabase.','success');
        navigateTo('bukti_absensi_berhasil');
      } catch (err) {
        console.error(err);
        showToast('Presensi gagal',err.message || 'Terjadi kesalahan saat menyimpan presensi.','error');
      }
    };

    // No demo identity/data is ever shown as an authenticated user.
    state.isAuthenticated = false;
    state.currentPage = 'login_karyawan';
    state.attendanceHistory = [];
    state.notifications = [];
    state.calendarEvents = [];
    state.overtimeClaims = [];
    state.teamDirectory = [];
    state.leaveRequests = [];

    window.addEventListener('DOMContentLoaded', () => {
      startLiveClock();
      refreshAuthenticatedApp();
    });
  </script>
</body>
</html>
